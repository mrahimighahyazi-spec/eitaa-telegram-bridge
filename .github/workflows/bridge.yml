name: Eitaa to Telegram Bridge

on:
  schedule:
    - cron: '*/15 * * * *' # اجرا هر ۱۵ دقیقه
  workflow_dispatch: # امکان اجرای دستی

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    permissions:
      contents: write # نیاز برای کامیت کردن تغییرات state.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bridge
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python bridge.py

      - name: Commit and push state.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update state.json" && git push)
